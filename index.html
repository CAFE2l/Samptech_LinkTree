<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samptech | LinkTree</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts para fonte moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <style>
        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Respeita preferências de acessibilidade */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            
            .animated-bg,
            .banner-container,
            .profile-img,
            .glass-effect,
            .btn-transition,
            .link-glow::after,
            .shimmer::before {
                animation: none !important;
                transition: none !important;
            }
        }
        
        body {
            background: #0a0a0a;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            will-change: scroll-position;
        }
        
        /* Efeito de fundo animado com partículas */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 15%, rgba(30, 58, 138, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(17, 24, 39, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(55, 65, 81, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 35%),
                radial-gradient(circle at 30% 70%, rgba(96, 165, 250, 0.12) 0%, transparent 35%),
                linear-gradient(135deg, #0a0a0a 0%, #111827 25%, #1f2937 50%, #111827 75%, #0a0a0a 100%);
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
            animation: gradientShift 25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            will-change: background;
        }
        
        /* Efeito de galáxia com estrelas */
        .galaxy-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { 
                opacity: 0.3;
                box-shadow: 0 0 2px rgba(255, 255, 255, 0.5);
            }
            50% { 
                opacity: 1;
                box-shadow: 0 0 8px rgba(255, 255, 255, 0.9),
                            0 0 12px rgba(59, 130, 246, 0.6);
            }
        }
        
        @keyframes gradientShift {
            0% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(2deg); }
            100% { filter: hue-rotate(0deg); }
        }
        
        /* Efeito de blur nos cards - ULTRA GLASS PREMIUM */
        .glass-effect {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px) saturate(200%) brightness(1.1);
            -webkit-backdrop-filter: blur(25px) saturate(200%) brightness(1.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.15),
                        0 0 20px rgba(59, 130, 246, 0.15);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, border-color, box-shadow;
        }
        
        .glass-effect:hover {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 60px 0 rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.25),
                        0 0 40px rgba(59, 130, 246, 0.3),
                        0 0 60px rgba(96, 165, 250, 0.2);
            transform: translateY(-4px) translateZ(0);
        }
        
        /* Efeito de LED animado PREMIUM nos cards */
        .led-effect {
            position: relative;
            overflow: hidden;
        }
        
        .led-effect::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                rgba(59, 130, 246, 0.6) 60deg,
                rgba(96, 165, 250, 0.9) 120deg,
                rgba(147, 197, 253, 0.7) 180deg,
                rgba(96, 165, 250, 0.9) 240deg,
                rgba(59, 130, 246, 0.6) 300deg,
                transparent 360deg
            );
            animation: ledRotate 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            opacity: 0;
            z-index: -1;
            filter: blur(8px);
            will-change: transform, opacity;
        }
        
        .led-effect:hover::before {
            opacity: 1;
        }
        
        @keyframes ledRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        /* Efeito de borda neon */
        .neon-border {
            position: relative;
        }
        
        .neon-border::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(135deg, 
                #1e3a8a, #3b82f6, #60a5fa, #93c5fd, 
                #a5b4fc, #818cf8, #93c5fd, #60a5fa);
            background-size: 200% 200%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: opacity;
            animation: neonShift 3s linear infinite;
        }
        
        @keyframes neonShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .neon-border:hover::after {
            opacity: 0.8;
        }
        
        /* Animação dos botões PREMIUM */
        .btn-transition {
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            will-change: transform, box-shadow;
        }
        
        .btn-transition:hover {
            transform: translateY(-8px) scale(1.05) translateZ(0);
            box-shadow: 0 30px 70px -10px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(96, 165, 250, 0.4),
                        0 0 80px rgba(59, 130, 246, 0.2);
        }
        
        .btn-transition:active {
            transform: translateY(-3px) scale(1.02);
        }
        
        /* Foto de perfil circular PREMIUM */
        .profile-img {
            border: 3px solid rgba(96, 165, 250, 0.5);
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.5),
                        0 0 100px rgba(30, 58, 138, 0.4),
                        0 25px 50px rgba(0, 0, 0, 0.6),
                        inset 0 0 30px rgba(96, 165, 250, 0.15);
            will-change: transform, box-shadow, border-color;
        }
        
        .profile-img:hover {
            transform: scale(1.08) rotate(2deg) translateZ(0);
            border-color: rgba(147, 197, 253, 0.8);
            box-shadow: 0 0 70px rgba(96, 165, 250, 0.7),
                        0 0 140px rgba(59, 130, 246, 0.5),
                        0 30px 60px rgba(0, 0, 0, 0.7),
                        inset 0 0 40px rgba(147, 197, 253, 0.25);
        }
        
        /* Container do banner */
        .banner-container {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 40px -10px rgba(0, 0, 0, 0.6),
                        0 0 50px rgba(59, 130, 246, 0.7),
                        0 0 100px rgba(30, 58, 138, 0.4),
                        inset 0 0 20px rgba(96, 165, 250, 0.1);
            border: 2px solid rgba(96, 165, 250, 0.5);
            animation: bannerGlow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            will-change: box-shadow;
        }
        
        @keyframes bannerGlow {
            0%, 100% {
                box-shadow: 0 15px 40px -10px rgba(0, 0, 0, 0.6),
                            0 0 50px rgba(59, 130, 246, 0.7),
                            0 0 100px rgba(30, 58, 138, 0.4),
                            inset 0 0 20px rgba(96, 165, 250, 0.1);
            }
            50% {
                box-shadow: 0 15px 40px -10px rgba(0, 0, 0, 0.6),
                            0 0 80px rgba(96, 165, 250, 0.9),
                            0 0 150px rgba(59, 130, 246, 0.6),
                            inset 0 0 30px rgba(147, 197, 253, 0.2);
            }
        }
        
        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.6s ease;
            filter: brightness(0.85) saturate(1.1);
            will-change: transform, filter;
        }
        
        .banner-container:hover .banner-img {
            transform: scale(1.12) translateZ(0);
            filter: brightness(1) saturate(1.2);
        }
        
        /* Overlay do banner para efeito glass */
        .banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 60%, rgba(0, 0, 0, 0.7) 100%);
            pointer-events: none;
        }
        
        /* Links com degrade personalizado */
        .gradient-link {
            position: relative;
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
        }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Efeito de brilho PREMIUM nos links */
        .link-glow {
            position: relative;
            overflow: hidden;
        }
        
        .link-glow::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.5) 0%, rgba(59, 130, 246, 0.3) 30%, transparent 70%);
            transform: translate(-50%, -50%) translateZ(0);
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            will-change: width, height;
        }
        
        .link-glow:hover::after {
            width: 400%;
            height: 400%;
        }
        
        /* Efeito de shimmer */
        .shimmer {
            position: relative;
            overflow: hidden;
        }
        
        .shimmer::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(147, 197, 253, 0.3),
                rgba(96, 165, 250, 0.4),
                transparent
            );
            animation: shimmerSlide 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            will-change: left;
        }
        
        @keyframes shimmerSlide {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        /* Scrollbar personalizada - APRIMORADA */
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #1e3a8a, #3b82f6, #60a5fa);
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
            transition: box-shadow 0.3s ease;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #1e40af, #60a5fa, #93c5fd);
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.5);
        }
        
        /* Animações de entrada */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) translateZ(0);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateZ(0);
            }
        }
        
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95) translateZ(0);
            }
            to {
                opacity: 1;
                transform: scale(1) translateZ(0);
            }
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-60px) translateZ(0);
            }
            to {
                opacity: 1;
                transform: translateX(0) translateZ(0);
            }
        }
        
        /* Efeito de partículas flutuantes - OTIMIZADO */
        .floating-particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            background: rgba(96, 165, 250, 0.2);
            border-radius: 50%;
            animation: float 25s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
            will-change: transform, opacity;
            filter: blur(2px);
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) translateX(0) translateZ(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) translateX(80px) translateZ(0);
                opacity: 0;
            }
        }
        
        /* Texto com gradiente animado */
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa, #93c5fd, #dbeafe, #a5b4fc, #818cf8, #93c5fd);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientFlow 6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            will-change: background-position;
        }
        
        @keyframes gradientFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        /* RESPONSIVIDADE MOBILE - OTIMIZADA */
        @media (max-width: 768px) {
            .banner-container {
                height: 140px;
                border-radius: 16px;
                animation: none;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4),
                            0 0 30px rgba(59, 130, 246, 0.4);
            }
            
            .banner-img {
                transition: filter 0.4s ease;
                filter: brightness(0.8) saturate(1);
            }
            
            .banner-container:hover .banner-img {
                transform: none;
                filter: brightness(0.9);
            }
            
            .profile-img {
                width: 90px !important;
                height: 90px !important;
                border-width: 2px;
                transition: border-color 0.4s ease;
            }
            
            .profile-img:hover {
                transform: scale(1.02);
                box-shadow: 0 0 35px rgba(59, 130, 246, 0.4),
                            0 0 70px rgba(30, 58, 138, 0.2),
                            0 15px 35px rgba(0, 0, 0, 0.5);
            }
            
            h1 {
                font-size: 1.6rem !important;
                margin-top: 0.8rem !important;
            }
            
            p {
                font-size: 0.9rem !important;
                padding: 0 1rem;
            }
            
            .glass-effect {
                backdrop-filter: blur(18px) saturate(180%);
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.15);
            }
            
            .glass-effect:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4),
                            0 0 20px rgba(59, 130, 246, 0.2);
            }
            
            .btn-transition:hover {
                transform: translateY(-2px) scale(1.01);
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4),
                            0 0 20px rgba(59, 130, 246, 0.2);
            }
            
            .container {
                padding-left: 1rem !important;
                padding-right: 1rem !important;
                padding-top: 1rem !important;
                padding-bottom: 1rem !important;
            }
            
            .led-effect::before {
                display: none;
            }
            
            .link-glow::after {
                width: 0 !important;
                height: 0 !important;
            }
            
            .link-glow:hover::after {
                display: none;
            }
            
            .neon-border::after {
                display: none;
            }
            
            .star {
                display: none;
            }
        }
        
        @media (max-width: 480px) {
            .banner-container {
                height: 110px;
                border-radius: 12px;
            }
            
            .profile-img {
                width: 70px !important;
                height: 70px !important;
                border-width: 2px;
            }
            
            .profile-img:hover {
                transform: scale(1.01);
            }
            
            h1 {
                font-size: 1.3rem !important;
                margin-top: 0.5rem !important;
                margin-bottom: 0.3rem !important;
            }
            
            p {
                font-size: 0.8rem !important;
            }
            
            .glass-effect a > div {
                padding: 0.85rem 1.1rem !important;
                gap: 0.6rem !important;
            }
            
            .glass-effect a > div > div {
                width: 36px !important;
                height: 36px !important;
                min-width: 36px;
            }
            
            .glass-effect a > div > div img {
                width: 22px !important;
                height: 22px !important;
            }
            
            .glass-effect a span {
                font-size: 0.9rem !important;
            }
            
            .glass-effect a i {
                font-size: 0.9rem !important;
            }
            
            .container {
                padding-top: 1rem !important;
                padding-bottom: 1rem !important;
            }
            
            #linksContainer {
                gap: 0.6rem !important;
            }
            
            .shimmer::before {
                display: none;
            }
        }
    </style>
</head>
<body class="relative">
    <!-- Fundo animado -->
    <div class="animated-bg"></div>
    
    <!-- Galáxia de estrelas -->
    <div class="galaxy-stars" id="galaxyStars"></div>
    
    <!-- Partículas flutuantes -->
    <div class="floating-particles" id="particles"></div>
    
    <!-- Container principal -->
    <div class="container mx-auto px-4 py-8 max-w-2xl relative z-10">
        <!-- Banner personalizável -->
        <div class="banner-container mb-8 shimmer" style="animation: fadeInScale 0.8s ease forwards;">
            <img id="bannerImage" class="banner-img" src="./img/banner samptech.jpeg" alt="Banner">
            <div class="banner-overlay"></div>
        </div>
        
        <!-- Perfil -->
        <div class="text-center mb-8 relative" style="animation: fadeInUp 0.8s ease 0.2s forwards; opacity: 0;">
            <div class="relative inline-block">
                <img id="profileImage" class="profile-img w-32 h-32 rounded-full object-cover mx-auto" src="./img/sampbost.jpg" alt="Profile">
            </div>
            <h1 id="profileName" class="text-4xl font-bold text-white mt-6 mb-3 gradient-text drop-shadow-2xl">Samptech - Assistência Técnica</h1>
            <p id="profileBio" class="text-gray-300 max-w-md mx-auto text-lg drop-shadow-lg">Resolvemos seus problemas tecnológicos com agilidade, transparência e qualidade.</p>
        </div>
        
        <!-- Seção de links -->
        <div id="linksContainer" class="space-y-4 mb-8">
            <!-- Links serão inseridos aqui via JavaScript -->
        </div>
        
        <!-- Rodapé -->
        <div class="text-center text-gray-500 text-sm glass-effect py-4 rounded-xl shimmer shadow-xl" style="animation: fadeInUp 0.8s ease 1s forwards; opacity: 0;">
            <p class="drop-shadow-md">© LinkTree Personalizado | Todos os direitos reservados</p>
        </div>
    </div>

    <script>
        // Estado da aplicação
        let links = [
            { title: 'Conheça nosso site', url: 'https://samptech.ct.ws', color1: '#1e3a8a', color2: '#3b82f6', imageUrl: './samp.png' },
            { title: ' Instagram', url: 'https://www.instagram.com/samptechassistencia', color1: '#1e40af', color2: '#60a5fa', imageUrl: './icons/instagram.png' },
            { title: 'Whatsapp', url: 'https://api.whatsapp.com/send/?phone=5564992800407&text&type=phone_number&app_absent=0', color1: '#1e293b', color2: '#475569', imageUrl: './icons/whats.png' },
            { title: 'Facebook', url: 'https://www.facebook.com/share/1Xbvmv8d3v/', color1: '#0f172a', color2: '#334155', imageUrl: './icons/face.jpg' }
        ];
        
        let currentGradientColor1 = '#ff6b6b';
        let currentGradientColor2 = '#4ecdc4';
        let currentPngUrl = '';
        
        // Função para renderizar links
        function renderLinks() {
            const container = document.getElementById('linksContainer');
            container.innerHTML = '';
            
            links.forEach((link, index) => {
                const linkElement = createLinkElement(link, index);
                container.appendChild(linkElement);
            });
        }
        
        // Função para criar elemento de link
        function createLinkElement(link, index) {
            const div = document.createElement('div');
            div.className = 'relative group';
            
            const gradientStyle = link.imageUrl ? 
                `linear-gradient(135deg, ${link.color1}, ${link.color2}), url('${link.imageUrl}')` :
                `linear-gradient(135deg, ${link.color1}, ${link.color2})`;
            
            div.innerHTML = `
                <div class="glass-effect led-effect neon-border rounded-xl p-1 btn-transition link-glow shimmer shadow-2xl">
                    <a href="${link.url}" target="_blank" class="block relative overflow-hidden rounded-lg group">
                        <div class="relative px-6 py-5 flex items-center gap-4 text-white">
                            <div class="w-12 h-12 flex items-center justify-center rounded-xl bg-gradient-to-br from-blue-500/20 to-blue-900/20 backdrop-blur-md transition-all duration-700 cubic-bezier(0.34, 1.56, 0.64, 1) group-hover:scale(130%) group-hover:rotate-12 group-hover:from-blue-400/40 group-hover:to-blue-800/40 shadow-xl border border-white/10 will-change-transform">
                                <img src="${link.imageUrl}" class="w-8 h-8 object-contain drop-shadow-2xl transition-all duration-500 cubic-bezier(0.34, 1.56, 0.64, 1) group-hover:scale-125 group-hover:rotate-6 will-change-transform" alt="icon">
                            </div>
                            <span class="font-bold text-xl tracking-wide drop-shadow-lg transition-all duration-500 cubic-bezier(0.34, 1.56, 0.64, 1) group-hover:translate-x-2 will-change-transform">${link.title}</span>
                            <i class="fas fa-arrow-right ml-auto opacity-0 group-hover:opacity-100 transition-all duration-700 cubic-bezier(0.34, 1.56, 0.64, 1) transform translate-x-[-10px] group-hover:translate-x-0 drop-shadow-lg text-xl will-change-transform"></i>
                        </div>
                    </a>
                </div>
            `;
            
            return div;
        }
        

        
        // Função para mostrar notificação
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'fixed bottom-4 right-4 glass-effect text-white px-6 py-3 rounded-xl animate-bounce';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // Efeito de digitação na bio
        function typeWriter(element, text, speed = 50) {
            let i = 0;
            element.textContent = '';
            element.style.borderRight = '2px solid rgba(255,255,255,0.7)';
            element.style.paddingRight = '5px';
            
            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    // Remove cursor após digitação
                    setTimeout(() => {
                        element.style.borderRight = 'none';
                    }, 500);
                }
            }
            
            type();
        }
        
        // Event listeners para conteúdo editável - OTIMIZADO
        document.addEventListener('DOMContentLoaded', () => {
            // Verifica se é mobile
            const isMobile = window.innerWidth < 768;
            
            // Cria galáxia de estrelas e partículas
            createGalaxyStars();
            createFloatingParticles();
            
            // Renderiza links
            renderLinks();
            
            // Adiciona efeito de digitação na bio
            const bioElement = document.getElementById('profileBio');
            const originalBio = bioElement.textContent;
            
            setTimeout(() => {
                if (!isMobile) {
                    typeWriter(bioElement, originalBio, 30);
                }
            }, 800);
            
            // Animação de entrada dos links com stagger - SEM GPU FRAME DROP
            requestAnimationFrame(() => {
                setTimeout(() => {
                    const linkElements = document.querySelectorAll('#linksContainer > div');
                    linkElements.forEach((link, index) => {
                        link.style.animation = `fadeInUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards`;
                        link.style.animationDelay = `${0.3 + index * 0.12}s`;
                        link.style.opacity = '0';
                    });
                }, 100);
            });
            
            // Adiciona efeito parallax no mouse apenas em desktop
            if (!isMobile) {
                addParallaxEffect();
            }
        });
        
        // Cria galáxia de estrelas - OTIMIZADO PARA MOBILE
        function createGalaxyStars() {
            const container = document.getElementById('galaxyStars');
            // Reduz estrelas em mobile
            const isMobile = window.innerWidth < 768;
            const starCount = isMobile ? 40 : 120;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() * 1.5 + 0.3;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                star.style.animationDuration = `${Math.random() * 2.5 + 2}s`;
                star.style.willChange = 'opacity, box-shadow';
                
                container.appendChild(star);
            }
        }
        
        // Cria partículas flutuantes - OTIMIZADO PARA MOBILE
        function createFloatingParticles() {
            const container = document.getElementById('particles');
            // Reduz partículas em mobile
            const isMobile = window.innerWidth < 768;
            const particleCount = isMobile ? 5 : 12;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 3 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 25}s`;
                particle.style.animationDuration = `${Math.random() * 12 + 18}s`;
                particle.style.willChange = 'transform, opacity';
                
                container.appendChild(particle);
            }
        }
        
        // Efeito parallax no mouse - DESABILITADO EM MOBILE
        function addParallaxEffect() {
            const isMobile = window.innerWidth < 768;
            
            if (!isMobile) {
                document.addEventListener('mousemove', (e) => {
                    const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
                    const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
                    
                    const profile = document.querySelector('.profile-img');
                    if (profile) {
                        profile.style.transform = `translate(${moveX}px, ${moveY}px) scale(1)`;
                    }
                }, { passive: true });
            }
        }
        
        // Salva dados no localStorage
        function saveToLocalStorage() {
            const data = {
                links: links,
                profileName: document.getElementById('profileName').textContent,
                profileBio: document.getElementById('profileBio').textContent,
                bannerImage: document.getElementById('bannerImage').src,
                profileImage: document.getElementById('profileImage').src
            };
            localStorage.setItem('linktreeData', JSON.stringify(data));
        }
        
        // Carrega dados do localStorage
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('linktreeData');
            if (saved) {
                const data = JSON.parse(saved);
                links = data.links;
                document.getElementById('profileName').textContent = data.profileName;
                document.getElementById('profileBio').textContent = data.profileBio;
                document.getElementById('bannerImage').src = data.bannerImage;
                document.getElementById('profileImage').src = data.profileImage;
                renderLinks();
            }
        }
        
        // Tenta carregar dados salvos
        // loadFromLocalStorage(); // REMOVIDO - agora usa HTML direto
        
        // Salva dados quando a página for fechada
        // window.addEventListener('beforeunload', saveToLocalStorage); // REMOVIDO
    </script>
</body>
